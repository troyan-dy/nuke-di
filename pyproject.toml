[project]
name = "nuke-di"
version = "1.10.2"
description = "Simplest type-hint based dependency injection for async Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitriy Troyan" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
  "di",
  "dependency-injection",
  "dependency-injection-container",
  "ioc",
  "inversion-of-control",
  "asyncio",
  "async",
  "type-hints",
  "lifecycle",
  "worker",
  "background-jobs",
  "graceful-shutdown",
  "cli",
  "fastapi",
  "litestar",
  "faststream",
  "pytest",
  "microservices",
  "kubernetes",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/troyan-dy/nuke-di"
Repository = "https://github.com/troyan-dy/nuke-di"
Issues = "https://github.com/troyan-dy/nuke-di/issues"
Changelog = "https://github.com/troyan-dy/nuke-di/blob/master/CHANGELOG.md"

[project.entry-points.pytest11]
nuke_di = "nuke_di.pytest_plugin"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.105",
]
faststream = [
    "faststream>=0.6",
]
litestar = [
    "litestar>=2.15",
]

[dependency-groups]
compare = [
    "dependency-injector>=4.49.1",
    "dishka>=1.10.1",
    "injector>=0.24.0",
    "matplotlib>=3.11.2",
    "wireup>=2.12.1",
]
dev = [
  "fastapi>=0.142.4",
  "faststream[nats]>=0.7.7",
  "httpx2>=2.13.1",
  "litestar>=2.24",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.uv]
# The comparison libraries of benchmarks/compare.py, which mypy checks
default-groups = ["dev", "compare"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs/i18n", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/nuke_di"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "A", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
files = ["src", "tests", "scripts", "benchmarks"]
strict = true
disallow_any_generics = false

[tool.pyright]
# Run from uvx, outside the project environment, so it is pointed at the venv of `uv sync`
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# The plugin of this package would import nuke_di before coverage starts; tests/test_pytest_plugin.py loads it
addopts = "-p no:nuke_di"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["nuke_di"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
