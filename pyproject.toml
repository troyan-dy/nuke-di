[project]
name = "nuke-di"
version = "1.3.0"
description = "Simplest type-hint based dependency injection for async Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitriy Troyan" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["di", "dependency-injection", "asyncio", "ioc", "type-hints"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/troyan-dy/nuke-di"
Repository = "https://github.com/troyan-dy/nuke-di"
Issues = "https://github.com/troyan-dy/nuke-di/issues"
Changelog = "https://github.com/troyan-dy/nuke-di/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/nuke_di"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "A", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
files = ["src", "tests"]
strict = true
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["nuke_di"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
