name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  version:
    # A pull request into master is a release once merged, so it must carry a new version
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base branch and the tags
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --no-project python scripts/version.py check "origin/${{ github.base_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --group compare
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync flake8 .  # wemake-python-styleguide, configured in setup.cfg
      - run: uv run --no-sync mypy
      - run: uvx pyright@1.1.414  # the pin of the Makefile

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    services:
      # The broker of the NATS examples, which tests/test_examples.py runs when it is reachable
      nats:
        image: nats:2.10
        ports: ["4222:4222"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest --cov --cov-report=term

  free-threaded:
    # The container is resolved from threads without a GIL; the framework extras have no free-threaded wheels
    # yet, so the job runs the tests that need none of them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15t"
      - run: make test-free-threaded

  fastapi-min:
    # The lowest FastAPI the `fastapi` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-fastapi-min

  faststream-min:
    # The lowest FastStream the `faststream` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-faststream-min

  litestar-min:
    # The lowest Litestar the `litestar` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-litestar-min

  mcp-min:
    # The lowest MCP SDK the `mcp` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-mcp-min

  fastmcp-min:
    # The lowest FastMCP the `fastmcp` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-fastmcp-min

  aiogram-min:
    # The lowest aiogram the `aiogram` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-aiogram-min

  taskiq-min:
    # The lowest taskiq and taskiq-dependencies the `taskiq` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-taskiq-min

  benchmarks:
    # The release workflow runs the same checks on pushes to master.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --locked --group compare pytest -m benchmarks tests/test_benchmarks.py
