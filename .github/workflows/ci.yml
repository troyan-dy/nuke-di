name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  version:
    # A pull request into master is a release once merged, so it must carry a new version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the base branch and the tags
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project python scripts/version.py check "origin/${{ github.base_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uvx pyright@1.1.414  # the pin of the Makefile

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      # The broker of the NATS examples, which tests/test_examples.py runs when it is reachable
      nats:
        image: nats:2.10
        ports: ["4222:4222"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term

  free-threaded:
    # The container is resolved from threads without a GIL; the framework extras have no free-threaded wheels
    # yet, so the job runs the tests that need none of them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14t"
      - run: make test-free-threaded

  fastapi-min:
    # The lowest FastAPI the `fastapi` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-fastapi-min

  faststream-min:
    # The lowest FastStream the `faststream` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-faststream-min

  litestar-min:
    # The lowest Litestar the `litestar` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-litestar-min

  aiogram-min:
    # The lowest aiogram the `aiogram` extra allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: make test-aiogram-min

  benchmarks:
    # A smoke run of the suite in benchmarks/, so it keeps working; the figures of a GitHub runner are too
    # noisy to gate on, docs/benchmarks.md holds the baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python benchmarks/run.py --size 10 --repeat 1
      - run: uv run python benchmarks/compare.py --size 10 --repeat 1
      - run: uv run python benchmarks/chart.py docs/benchmarks/compare-py3.11.json compare.png
