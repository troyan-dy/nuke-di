<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288" role="img" aria-labelledby="t d">
<title id="t">How nuke-di connects six clients</title>
<desc id="d">Postgres takes 0.3 s, Kafka and Redis 0.05 s; Repository needs Postgres, Consumer (0.3 s) needs Kafka, Http (0.2 s) needs Redis. Consumer and Http start once Kafka and Redis have connected, without waiting for Postgres, and the startup takes as long as its longest chain, 0.35 s.</desc>
<style>
svg {
  --surface: #fcfcfb; --border: #e4e3df; --text: #0b0b0b; --muted: #52514e; --grid: #ecebe7;
  --bar: #2a78d6; --wait: #a3a29c; --total: #0b0b0b; --playhead: #eb6834;
}
@media (prefers-color-scheme: dark) {
  svg {
    --surface: #1a1a19; --border: #33332f; --text: #ffffff; --muted: #c3c2b7; --grid: #2a2a27;
    --bar: #3987e5; --wait: #77766f; --total: #ffffff; --playhead: #d95926;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.bg { fill: var(--surface); stroke: var(--border); }
.heading { font-size: 15px; font-weight: 600; }
.title { font-size: 13px; font-weight: 600; }
.label { font-size: 12px; }
.dep, .tick, .note { fill: var(--muted); }
.tick, .note { font-size: 11px; }
.total-label { font-size: 13px; font-weight: 600; }
.grid { stroke: var(--grid); stroke-width: 1; }
.bar { fill: var(--bar); }
.wait { fill: url(#hatch); stroke: var(--wait); stroke-width: 1; }
.hatch-line { stroke: var(--wait); stroke-width: 2; }
.barrier { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.total { stroke: var(--total); stroke-width: 2; }
.playhead { stroke: var(--playhead); stroke-width: 2; animation: sweep 7.300000000000001s linear infinite; }
rect.bar, rect.wait { transform-box: fill-box; transform-origin: left center; }
[class*=" g"], [class*=" a"] { animation-duration: 7.300000000000001s; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes sweep {
  0% { transform: translateX(0); opacity: 1 }
  65.75% { transform: translateX(492.0px); opacity: 1 }
  65.76%, 100% { transform: translateX(492.0px); opacity: 0 }
}
@keyframes g1 { 0%, 0.00% { transform: scaleX(0) } 49.32%, 100% { transform: scaleX(1) } }
.g1 { animation-name: g1 }
@keyframes g2 { 0%, 0.00% { transform: scaleX(0) } 8.22%, 100% { transform: scaleX(1) } }
.g2 { animation-name: g2 }
@keyframes g3 { 0%, 0.00% { transform: scaleX(0) } 8.22%, 100% { transform: scaleX(1) } }
.g3 { animation-name: g3 }
@keyframes a4 { 0%, 49.32% { opacity: 0 } 50.14%, 100% { opacity: 1 } }
.a4 { animation-name: a4 }
@keyframes g5 { 0%, 8.22% { transform: scaleX(0) } 57.53%, 100% { transform: scaleX(1) } }
.g5 { animation-name: g5 }
@keyframes g6 { 0%, 8.22% { transform: scaleX(0) } 41.10%, 100% { transform: scaleX(1) } }
.g6 { animation-name: g6 }
@keyframes a7 { 0%, 57.53% { opacity: 0 } 58.36%, 100% { opacity: 1 } }
.a7 { animation-name: a7 }
@keyframes a8 { 0%, 57.53% { opacity: 0 } 58.36%, 100% { opacity: 1 } }
.a8 { animation-name: a8 }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .playhead { display: none; }
}
</style>
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/>
  </pattern>
</defs>
<rect class="bg" x="0.5" y="0.5" width="759" height="287" rx="8"/>
<text class="heading" x="16" y="26">Every client connects as soon as its own dependencies have</text>
<text class="title" x="16" y="60">Startup of the example in the Clients guide</text>
<line class="grid" x1="204.0" y1="70" x2="204.0" y2="218"/>
<line class="grid" x1="327.0" y1="70" x2="327.0" y2="218"/>
<line class="grid" x1="450.0" y1="70" x2="450.0" y2="218"/>
<line class="grid" x1="573.0" y1="70" x2="573.0" y2="218"/>
<line class="grid" x1="696.0" y1="70" x2="696.0" y2="218"/>
<text class="label" x="196" y="86" text-anchor="end">Postgres</text>
<rect class="bar g1" x="204.0" y="74" width="369.0" height="14" rx="3"/>
<text class="label" x="196" y="110" text-anchor="end">Kafka</text>
<rect class="bar g2" x="204.0" y="98" width="61.5" height="14" rx="3"/>
<text class="label" x="196" y="134" text-anchor="end">Redis</text>
<rect class="bar g3" x="204.0" y="122" width="61.5" height="14" rx="3"/>
<text class="label" x="196" y="158" text-anchor="end">Repository<tspan class="dep"> ← Postgres</tspan></text>
<rect class="bar a4" x="571.0" y="146" width="4" height="14" rx="2"/>
<text class="label" x="196" y="182" text-anchor="end">Consumer<tspan class="dep"> ← Kafka</tspan></text>
<rect class="bar g5" x="265.5" y="170" width="369.0" height="14" rx="3"/>
<text class="label" x="196" y="206" text-anchor="end">Http<tspan class="dep"> ← Redis</tspan></text>
<rect class="bar g6" x="265.5" y="194" width="246.0" height="14" rx="3"/>
<line class="total a7" x1="634.5" y1="48" x2="634.5" y2="220"/>
<text class="total-label a8" x="639.5" y="60">0.35 s</text>
<text class="tick" x="204.0" y="244" text-anchor="middle">0.0 s</text>
<text class="tick" x="327.0" y="244" text-anchor="middle">0.1 s</text>
<text class="tick" x="450.0" y="244" text-anchor="middle">0.2 s</text>
<text class="tick" x="573.0" y="244" text-anchor="middle">0.3 s</text>
<text class="tick" x="696.0" y="244" text-anchor="middle">0.4 s</text>
<rect class="bar" x="16" y="260" width="22" height="12" rx="3"/>
<text class="note" x="44" y="270">connect()</text>
<line class="playhead" x1="204" y1="66" x2="204" y2="222"/>
</svg>
