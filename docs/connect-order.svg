<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" role="img" aria-labelledby="t d">
<title id="t">Connect order of six clients, by layer and by own dependencies</title>
<desc id="d">Postgres takes 0.3 s, Kafka and Redis 0.05 s; Repository needs Postgres, Consumer (0.3 s) needs Kafka, Http (0.2 s) needs Redis. By layer, Consumer and Http wait for Postgres and the startup takes 0.60 s. By own dependencies, Consumer and Http start once Kafka and Redis have connected and the startup takes 0.35 s.</desc>
<style>
svg {
  --surface: #fcfcfb; --border: #e4e3df; --text: #0b0b0b; --muted: #52514e; --grid: #ecebe7;
  --bar: #2a78d6; --wait: #a3a29c; --total: #0b0b0b; --playhead: #eb6834;
}
@media (prefers-color-scheme: dark) {
  svg {
    --surface: #1a1a19; --border: #33332f; --text: #ffffff; --muted: #c3c2b7; --grid: #2a2a27;
    --bar: #3987e5; --wait: #77766f; --total: #ffffff; --playhead: #d95926;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.bg { fill: var(--surface); stroke: var(--border); }
.heading { font-size: 15px; font-weight: 600; }
.title { font-size: 13px; font-weight: 600; }
.label { font-size: 12px; }
.dep, .tick, .note { fill: var(--muted); }
.tick, .note { font-size: 11px; }
.total-label { font-size: 13px; font-weight: 600; }
.grid { stroke: var(--grid); stroke-width: 1; }
.bar { fill: var(--bar); }
.wait { fill: url(#hatch); stroke: var(--wait); stroke-width: 1; }
.hatch-line { stroke: var(--wait); stroke-width: 2; }
.barrier { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.total { stroke: var(--total); stroke-width: 2; }
.playhead { stroke: var(--playhead); stroke-width: 2; animation: sweep 9.0s linear infinite; }
rect.bar, rect.wait { transform-box: fill-box; transform-origin: left center; }
[class*=" g"], [class*=" a"] { animation-duration: 9.0s; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes sweep {
  0% { transform: translateX(0); opacity: 1 }
  66.67% { transform: translateX(492.0px); opacity: 1 }
  66.68%, 100% { transform: translateX(492.0px); opacity: 0 }
}
@keyframes a1 { 0%, 33.33% { opacity: 0 } 33.89%, 100% { opacity: 1 } }
.a1 { animation-name: a1 }
@keyframes a2 { 0%, 33.33% { opacity: 0 } 33.89%, 100% { opacity: 1 } }
.a2 { animation-name: a2 }
@keyframes g3 { 0%, 0.00% { transform: scaleX(0) } 33.33%, 100% { transform: scaleX(1) } }
.g3 { animation-name: g3 }
@keyframes g4 { 0%, 0.00% { transform: scaleX(0) } 5.56%, 100% { transform: scaleX(1) } }
.g4 { animation-name: g4 }
@keyframes g5 { 0%, 0.00% { transform: scaleX(0) } 5.56%, 100% { transform: scaleX(1) } }
.g5 { animation-name: g5 }
@keyframes a6 { 0%, 33.33% { opacity: 0 } 33.89%, 100% { opacity: 1 } }
.a6 { animation-name: a6 }
@keyframes g7 { 0%, 5.56% { transform: scaleX(0) } 33.33%, 100% { transform: scaleX(1) } }
.g7 { animation-name: g7 }
@keyframes g8 { 0%, 33.33% { transform: scaleX(0) } 66.67%, 100% { transform: scaleX(1) } }
.g8 { animation-name: g8 }
@keyframes g9 { 0%, 5.56% { transform: scaleX(0) } 33.33%, 100% { transform: scaleX(1) } }
.g9 { animation-name: g9 }
@keyframes g10 { 0%, 33.33% { transform: scaleX(0) } 55.56%, 100% { transform: scaleX(1) } }
.g10 { animation-name: g10 }
@keyframes a11 { 0%, 66.67% { opacity: 0 } 67.22%, 100% { opacity: 1 } }
.a11 { animation-name: a11 }
@keyframes a12 { 0%, 66.67% { opacity: 0 } 67.22%, 100% { opacity: 1 } }
.a12 { animation-name: a12 }
@keyframes g13 { 0%, 0.00% { transform: scaleX(0) } 33.33%, 100% { transform: scaleX(1) } }
.g13 { animation-name: g13 }
@keyframes g14 { 0%, 0.00% { transform: scaleX(0) } 5.56%, 100% { transform: scaleX(1) } }
.g14 { animation-name: g14 }
@keyframes g15 { 0%, 0.00% { transform: scaleX(0) } 5.56%, 100% { transform: scaleX(1) } }
.g15 { animation-name: g15 }
@keyframes a16 { 0%, 33.33% { opacity: 0 } 33.89%, 100% { opacity: 1 } }
.a16 { animation-name: a16 }
@keyframes g17 { 0%, 5.56% { transform: scaleX(0) } 38.89%, 100% { transform: scaleX(1) } }
.g17 { animation-name: g17 }
@keyframes g18 { 0%, 5.56% { transform: scaleX(0) } 27.78%, 100% { transform: scaleX(1) } }
.g18 { animation-name: g18 }
@keyframes a19 { 0%, 38.89% { opacity: 0 } 39.44%, 100% { opacity: 1 } }
.a19 { animation-name: a19 }
@keyframes a20 { 0%, 38.89% { opacity: 0 } 39.44%, 100% { opacity: 1 } }
.a20 { animation-name: a20 }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .playhead { display: none; }
}
</style>
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/>
  </pattern>
</defs>
<rect class="bg" x="0.5" y="0.5" width="759" height="491" rx="8"/>
<text class="heading" x="16" y="26">The same six clients, connected two ways</text>
<text class="title" x="16" y="60">By layer, up to 1.11</text>
<line class="grid" x1="204.0" y1="70" x2="204.0" y2="218"/>
<line class="grid" x1="286.0" y1="70" x2="286.0" y2="218"/>
<line class="grid" x1="368.0" y1="70" x2="368.0" y2="218"/>
<line class="grid" x1="450.0" y1="70" x2="450.0" y2="218"/>
<line class="grid" x1="532.0" y1="70" x2="532.0" y2="218"/>
<line class="grid" x1="614.0" y1="70" x2="614.0" y2="218"/>
<line class="grid" x1="696.0" y1="70" x2="696.0" y2="218"/>
