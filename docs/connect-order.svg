<text class="label" x="196" y="158" text-anchor="end">Repository<tspan class="dep"> ← Postgres</tspan></text>
<rect class="bar a6" x="448.0" y="146" width="4" height="14" rx="2"/>
<text class="label" x="196" y="182" text-anchor="end">Consumer<tspan class="dep"> ← Kafka</tspan></text>
<rect class="wait g7" x="245.0" y="170" width="205.0" height="14" rx="3"/>
<rect class="bar g8" x="450.0" y="170" width="246.0" height="14" rx="3"/>
<text class="label" x="196" y="206" text-anchor="end">Http<tspan class="dep"> ← Redis</tspan></text>
<rect class="wait g9" x="245.0" y="194" width="205.0" height="14" rx="3"/>
<rect class="bar g10" x="450.0" y="194" width="164.0" height="14" rx="3"/>
<line class="total a11" x1="696.0" y1="48" x2="696.0" y2="220"/>
<text class="total-label a12" x="701.0" y="60">0.60 s</text>
<text class="title" x="16" y="264">By own dependencies, from 1.12</text>
<line class="grid" x1="204.0" y1="274" x2="204.0" y2="422"/>
<line class="grid" x1="286.0" y1="274" x2="286.0" y2="422"/>
<line class="grid" x1="368.0" y1="274" x2="368.0" y2="422"/>
<line class="grid" x1="450.0" y1="274" x2="450.0" y2="422"/>
<line class="grid" x1="532.0" y1="274" x2="532.0" y2="422"/>
<line class="grid" x1="614.0" y1="274" x2="614.0" y2="422"/>
<line class="grid" x1="696.0" y1="274" x2="696.0" y2="422"/>
<text class="label" x="196" y="290" text-anchor="end">Postgres</text>
<rect class="bar g13" x="204.0" y="278" width="246.0" height="14" rx="3"/>
<text class="label" x="196" y="314" text-anchor="end">Kafka</text>
<rect class="bar g14" x="204.0" y="302" width="41.0" height="14" rx="3"/>
<text class="label" x="196" y="338" text-anchor="end">Redis</text>
<rect class="bar g15" x="204.0" y="326" width="41.0" height="14" rx="3"/>
