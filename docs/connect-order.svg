<text class="tick" x="614.0" y="448" text-anchor="middle">0.5 s</text>
<text class="tick" x="696.0" y="448" text-anchor="middle">0.6 s</text>
<rect class="bar" x="16" y="464" width="22" height="12" rx="3"/>
<text class="note" x="44" y="474">connect()</text>
<rect class="wait" x="130" y="464" width="22" height="12" rx="3"/>
