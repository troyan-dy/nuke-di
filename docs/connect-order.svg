.total-label { font-size: 13px; font-weight: 600; }
.grid { stroke: var(--grid); stroke-width: 1; }
.bar { fill: var(--bar); }
.wait { fill: url(#hatch); stroke: var(--wait); stroke-width: 1; }
.hatch-line { stroke: var(--wait); stroke-width: 2; }
.barrier { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.total { stroke: var(--total); stroke-width: 2; }
.playhead { stroke: var(--playhead); stroke-width: 2; animation: sweep 12.0s linear infinite; }
rect.bar, rect.wait { transform-box: fill-box; transform-origin: left center; }
[class*=" g"], [class*=" a"] { animation-duration: 12.0s; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes sweep {
  0% { transform: translateX(0); opacity: 1 }
  75.00% { transform: translateX(492.0px); opacity: 1 }
  75.01%, 100% { transform: translateX(492.0px); opacity: 0 }
