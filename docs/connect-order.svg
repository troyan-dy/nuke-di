<svg xmlns="http://www.w3.org/2000/svg" width="760" height="696" viewBox="0 0 760 696" role="img" aria-labelledby="t d">
<title id="t">Connect order of six clients: one after another, by layer and by own dependencies</title>
<desc id="d">Postgres takes 0.3 s, Kafka and Redis 0.05 s; Repository needs Postgres, Consumer (0.3 s) needs Kafka, Http (0.2 s) needs Redis. One after another, in resolution order, the startup takes 0.90 s. By layer, Consumer and Http wait for Postgres and it takes 0.60 s. By own dependencies, Consumer and Http start once Kafka and Redis have connected and it takes 0.35 s.</desc>
<style>
svg {
  --surface: #fcfcfb; --border: #e4e3df; --text: #0b0b0b; --muted: #52514e; --grid: #ecebe7;
  --bar: #2a78d6; --wait: #a3a29c; --total: #0b0b0b; --playhead: #eb6834;
}
@media (prefers-color-scheme: dark) {
