<text class="value" x="722.7" y="811">3.41 s<tspan class="ratio">  10.2× longer</tspan></text>
<text class="title" x="24" y="850">Shutdown: disconnect() of every client</text>
<text class="note" x="24" y="868">Checkout and EventsProducer, outlined above, take 300 ms each to stop, the others up to 50 ms; every client disconnects after the clients that need it.</text>
