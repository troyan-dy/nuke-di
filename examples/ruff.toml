# The rules of the repository, with the imports sorted as in a project that uses nuke-di:
# nuke_di is a third-party package and every example, run from this directory, is first-party
extend = "../pyproject.toml"
src = ["."]

[lint.isort]
known-third-party = ["nuke_di"]

[lint.flake8-bugbear]
# A dependency of taskiq is a default value, as in its documentation
extend-immutable-calls = ["taskiq.TaskiqDepends"]
