# flake8 runs wemake-python-styleguide only: ruff covers the rest (pyproject.toml).
# flake8 reads no pyproject.toml, so its configuration lives here.

[flake8]
# The violation format of wemake-python-styleguide, with the source line under it
format = wemake
show-source = true
# Only WPS and syntax errors: pycodestyle, pyflakes and the rest are ruff's
select = WPS, E999
# WPS483 asks for `frozendict` on Python 3.15+, which has none before 3.15: the package supports 3.11
extend-ignore = WPS483
# Virtualenvs, other sessions' worktrees and build output are not ours to lint
extend-exclude =
  .venv
  .claude
  build
  dist
  htmlcov

# "handler" is a glossary word (CONTEXT.md, Integration) and the name aiogram, Litestar, pydantic and signal
# give the same object
allowed-domain-names = handler
# `__all__` declares the public API, which mypy strict (no implicit re-export), pyright and star imports read
allowed-module-metadata = __all__

# flake8 applies only ONE entry per file, the one with the longest matching pattern: an entry for a narrower pattern
# repeats every code of a broader one that also matches its files. `*` crosses `/`.
per-file-ignores =
  # Package roots hold only re-exports and the `__all__` that declares them, which WPS412 counts as logic
  src/nuke_di/*__init__.py: WPS412
  # The cold resolution loop: one function on an explicit stack of tuple frames, for chains deeper than the
  # recursion limit; helpers or a NamedTuple frame cost 8-13% per client, measured (see the comment on Frame)
  src/nuke_di/_container/tree.py: WPS210, WPS231, WPS236
  # check() builds a fresh handler per case: bind() rewrites a handler's signature and marks it with one
  # framework and container, so a module-level handler would leak from one check into the next
  src/nuke_di/integration/testing/cases.py: WPS430
  # WPS118: a test's name is the sentence pytest reports, nothing calls it.
  # WPS201: an integration's tests import the surface of the framework under test.
  # WPS202, WPS211, WPS226: ignored in tests upstream. WPS432: numbers are test data (wemake-django-template).
  # WPS204: each test repeats the call it exercises; sharing it means fixtures coupling independent tests.
  # WPS430, WPS431: handlers, entrypoints and clients are built per test: the container caches what it read on a
  # class, bind() marks a function for one framework and container, and some tests check local qualnames.
  # WPS476: a test drives one lifecycle after another and asserts between the awaits.
  tests/*.py: WPS118, WPS201, WPS202, WPS204, WPS211, WPS226, WPS430, WPS431, WPS432, WPS476
  # The examples' own tests, the same reasons as tests/
  examples/*/test_*.py: WPS118, WPS226, WPS430, WPS432, WPS476
  # WPS421: the examples print what their READMEs, the guide and skills/nuke-di/SKILL.md show.
  # WPS476: they send, publish and print one item at a time; the order is the output their READMEs show.
  examples/*.py: WPS421, WPS476
  # The hidden tests graded against the agents' projects, the same reasons as tests/
  benchmarks/agents/hidden/*.py: WPS118, WPS430, WPS432
  # The agents' reference solutions: the code the guide teaches, prints included
  benchmarks/agents/reference/*.py: WPS421
  # Their tests, the same reasons as tests/ (their names are short enough)
  benchmarks/agents/reference/*test_*.py: WPS430, WPS432
  # Awaiting in order is what these benchmarks time: the ideal reference, sequential requests and samples
  benchmarks/run.py: WPS476
